name: 시세 데이터 업데이트

on:
  schedule:
    # 한국 시간 화~토 오전 7시 30분 (미국 장 마감 후)
    - cron: "30 22 * * 1-5"
    # 한국 시간 월~금 오전 9시 30분 (한국 물가·고용 발표(오전 8시) 뒤 경제 일정 결과 채우기)
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치면 순서대로 하나씩 (동시에 저장하다 충돌하지 않게)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python scripts/fetch_data.py
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      - name: 경제 일정 결과 채우기
        run: python scripts/update_calendar.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/calendar.json
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없어요"
            exit 0
          fi
          git commit -m "시세 데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          # 실행 중에 저장소에 새 커밋이 올라왔으면, 그걸 먼저 받아 합친 뒤 올립니다.
          # 데이터 파일이 겹치면 방금 받은 새 데이터를 우선합니다. (최대 3번 시도)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "올리기 실패, $i번째 다시 시도…"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
